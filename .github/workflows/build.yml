name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Backup our Android files
        run: cp -r android /tmp/android_overlay

      - name: Generate missing Android scaffolding
        run: flutter create --platforms=android --org com.example --project-name virtual_tryon .

      - name: Restore our Android files
        run: cp -r /tmp/android_overlay/. android/

      - name: Patch Gradle (minSdk 21 + ML Kit)
        run: python3 tool/patch_gradle.py

      - run: flutter pub get

      - name: Unit tests
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
